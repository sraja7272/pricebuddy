services:
  app:
    build:
      context: .
      dockerfile: docker/php.dockerfile
    restart: unless-stopped
    ports:
    - 7242:80
    environment:
      DB_HOST: db
      DB_DATABASE: pricebuddy
      SCRAPER_BASE_URL: http://scraper:3000
      SEARXNG_URL: http://searxng:8080
      FORCE_HTTPS: "true"
      TRUSTED_PROXIES: "*"
      OIDC_SCOPES: "openid profile email groups"
      # Fill out the following in Komodo
      APP_KEY: ${APP_KEY}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_URL: ${APP_URL}
      ASSET_URL: ${APP_URL}
      APP_USER_EMAIL: ${APP_USER_EMAIL}               # Only used for seeding the database
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}         # Only used for seeding the database
      # OIDC / SSO — optional, leave unset to use local login only
      OIDC_BASE_URL: ${OIDC_BASE_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP}
      DISABLE_LOCAL_LOGIN: ${DISABLE_LOCAL_LOGIN}
    volumes:
    - /data/price-tracker/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: splunk
      options:
        splunk-url: "https://splunk-collector.raja-house.com"
        splunk-token: "${SPLUNK_TOKEN}" # Defined in Komodo Compose file environment variables
        splunk-index: "docker"
        splunk-source: "price-tracker-app"
        splunk-sourcetype: "docker:container"
        splunk-verify-connection: "false"
  
  db:
    image: mysql:9.7.0@sha256:c11782aa2a96624c1efc121768641d96954faa136d6aa82751b032d8c426ffbc
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pricebuddy
      # Fill out the following in Komodo
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - /data/price-tracker/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: splunk
      options:
        splunk-url: "https://splunk-collector.raja-house.com"
        splunk-token: "${SPLUNK_TOKEN}" # Defined in Komodo Compose file environment variables
        splunk-index: "docker"
        splunk-source: "price-tracker-db"
        splunk-sourcetype: "docker:container"
        splunk-verify-connection: "false"

  scraper:
    image: jez500/seleniumbase-scrapper:v1.0@sha256:501895ba8e1f592b0480c870d10113b94f1a2ba3185dfaf89b41b9e36fe8f25f
    restart: unless-stopped
    logging:
      driver: splunk
      options:
        splunk-url: "https://splunk-collector.raja-house.com"
        splunk-token: "${SPLUNK_TOKEN}" # Defined in Komodo Compose file environment variables
        splunk-index: "docker"
        splunk-source: "price-tracker-scraper"
        splunk-sourcetype: "docker:container"
        splunk-verify-connection: "false"

  searxng:
    image: searxng/searxng:latest@sha256:e4fade70be2f6a985178de7158c96fdb98d897500c548b3afc6e2033cf1c11e3
    restart: unless-stopped
    volumes:
      - /data/price-tracker/searxng:/etc/searxng
    logging:
      driver: splunk
      options:
        splunk-url: "https://splunk-collector.raja-house.com"
        splunk-token: "${SPLUNK_TOKEN}" # Defined in Komodo Compose file environment variables
        splunk-index: "docker"
        splunk-source: "price-tracker-searxng"
        splunk-sourcetype: "docker:container"
        splunk-verify-connection: "false"

